<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rock Paper Scissors — Neon Arena</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div><div class="vignette"></div>

<header class="topbar">
  <button class="icon-btn" id="settings" aria-label="Settings">⚙️</button>
  <div class="score-card player-card"><div class="avatar">👤</div><div><span>Player</span><strong id="playerScore">3</strong></div><div class="trophy">🏆</div></div>
  <div class="logo"><div class="logo-title"><span>ROCK</span><i>•</i><b>PAPER</b><i>•</i><em>SCISSORS</em></div><div class="tagline">Make Your Move!</div></div>
  <div class="score-card cpu-card"><div><span>Computer</span><strong id="cpuScore">2</strong></div><div class="trophy">🏆</div><div class="avatar">🤖</div></div>
  <div class="audio-controls"><button class="icon-btn" id="soundBtn">🔊</button><button class="icon-btn" id="musicBtn">🎵</button></div>
</header>

<main class="layout">
  <aside class="panel rules"><h2>💡 Game Rules</h2><div class="rule"><b>🪨</b><span><strong>Rock</strong><small>beats Scissors ✂️</small></span></div><div class="rule"><b>📄</b><span><strong>Paper</strong><small>beats Rock 🪨</small></span></div><div class="rule"><b>✂️</b><span><strong>Scissors</strong><small>beats Paper 📄</small></span></div></aside>

  <section class="arena">
    <div class="battle">
      <div class="choice-side you"><div class="ribbon blue">YOU CHOSE</div><div class="hand-orb blue-orb"><div id="playerHand" class="hand">✊</div></div><div id="playerLabel" class="choice-label blue-label">🪨 ROCK</div></div>
      <div class="versus"><div>VS</div><span id="result">YOU WIN!</span></div>
      <div class="choice-side computer"><div class="ribbon red">COMPUTER CHOSE</div><div class="hand-orb red-orb"><div id="cpuHand" class="hand">✌️</div></div><div id="cpuLabel" class="choice-label red-label">✂️ SCISSORS</div></div>
    </div>
    <div class="choose-title">Choose Your Move</div>
    <div class="choices">
      <button class="choice-btn rock" data-choice="rock"><span class="big-hand">✊</span><span>🪨 ROCK</span></button>
      <button class="choice-btn paper" data-choice="paper"><span class="big-hand">🖐️</span><span>📄 PAPER</span></button>
      <button class="choice-btn scissors" data-choice="scissors"><span class="big-hand">✌️</span><span>✂️ SCISSORS</span></button>
    </div>
    <div class="actions"><button id="reset">↻ &nbsp; RESET SCORE</button><button id="playAgain" class="primary">▶ &nbsp; PLAY AGAIN</button><button id="quickPlay">⚡ &nbsp; QUICK PLAY</button></div>
  </section>

  <aside class="panel stats"><h2>📊 Stats</h2><div class="stat"><span>🎮 Games Played</span><b id="games">5</b></div><div class="stat win"><span>🏆 Wins</span><b id="wins">3</b></div><div class="stat loss"><span>💀 Losses</span><b id="losses">2</b></div><div class="stat draw"><span>🤝 Draws</span><b id="draws">0</b></div></aside>
</main>

<div class="toast" id="toast">Make your move!</div>
<script src="script.js"></script>
</body>
</html>
